<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Basket Insight Agent</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #667085; --line: #e3e6eb;
  --accent: #2f5bea; --accent-soft: #e8eeff; --ok: #157f3b; --ok-soft: #e4f6ea;
  --bad: #b42318; --bad-soft: #fde8e6; --warn: #9a6200; --warn-soft: #fff3d6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151b; --panel: #1b1f27; --text: #e6e8ec; --muted: #9aa3b2; --line: #2c323d;
    --accent: #7c9cff; --accent-soft: #232c45; --ok: #5fd08a; --ok-soft: #173023;
    --bad: #ff8a80; --bad-soft: #3a1d1b; --warn: #f2c14e; --warn-soft: #3a2f14;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
header { padding: 20px 16px 8px; max-width: 1080px; margin: 0 auto; }
header h1 { margin: 0; font-size: 22px; }
header p { margin: 4px 0 0; color: var(--muted); }
main { max-width: 1080px; margin: 0 auto; padding: 8px 16px 40px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-top: 14px; }
.tabs { display: flex; gap: 6px; margin-top: 10px; }
.tabs button { background: none; border: 1px solid var(--line); color: var(--text); padding: 7px 14px; border-radius: 999px; cursor: pointer; font: inherit; }
.tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
textarea, input, select { width: 100%; font: inherit; color: var(--text); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; }
textarea { min-height: 70px; resize: vertical; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin-top: 10px; }
.row > * { flex: 1 1 160px; }
label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 3px; }
button.go { flex: 0 0 auto; background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; font: inherit; cursor: pointer; }
button.go:disabled { opacity: .5; cursor: wait; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chips button { background: var(--accent-soft); color: var(--accent); border: 0; border-radius: 999px; padding: 4px 10px; font-size: 13px; cursor: pointer; }
.status { font-size: 13px; color: var(--muted); }
.badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 13px; font-weight: 600; }
.b-ok { background: var(--ok-soft); color: var(--ok); }
.b-bad { background: var(--bad-soft); color: var(--bad); }
.b-warn { background: var(--warn-soft); color: var(--warn); }
.answer { white-space: pre-wrap; margin: 10px 0; }
.meta { color: var(--muted); font-size: 13px; }
mark.bad { background: var(--bad-soft); color: var(--bad); padding: 0 2px; border-radius: 3px; }
mark.ok { background: var(--ok-soft); color: var(--ok); padding: 0 2px; border-radius: 3px; }
.tablewrap { overflow-x: auto; margin-top: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 600; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
details { margin-top: 10px; }
summary { cursor: pointer; }
code { font-size: 13px; }
.err { color: var(--bad); }
.hidden { display: none; }
</style>
</head>
<body>
<header>
  <h1>Basket Insight Agent</h1>
  <p>UCI Online Retail II · 1년 차(2009-12 ~ 2010-11) 연관 규칙을 Solar 에이전트로 묻고, 답의 수치를 규칙 표와 대조합니다.</p>
  <p class="status" id="health">서버 확인 중…</p>
  <div class="tabs">
    <button class="on" data-tab="ask">에이전트에게 묻기</button>
    <button data-tab="browse">규칙 직접 조회</button>
  </div>
</header>
<main>
  <section id="tab-ask">
    <div class="panel">
      <label for="q">질문</label>
      <textarea id="q" placeholder="예: 85123A와 함께 잘 팔리는 상품은?"></textarea>
      <div class="chips" id="examples"></div>
      <div class="row">
        <div>
          <label for="method">방식</label>
          <select id="method">
            <option value="tool">Solar + 도구 (규칙 표 조회)</option>
            <option value="paste">Solar + 표 붙여 넣기</option>
            <option value="router">키워드 라우터 (LLM 없음, 키 불필요)</option>
          </select>
        </div>
        <button class="go" id="askBtn">묻기</button>
      </div>
    </div>
    <div class="panel hidden" id="result"></div>
  </section>

  <section id="tab-browse" class="hidden">
    <div class="panel">
      <div class="row">
        <div><label for="product">상품 코드 또는 이름 일부</label><input id="product" placeholder="85123A, HEART, LUNCH BAG…"></div>
        <button class="go" data-q="rules_for">상품 규칙</button>
      </div>
      <div class="row">
        <div><label for="sup">최소 support</label><input id="sup" type="number" step="0.001" value="0.01"></div>
        <div><label for="conf">최소 confidence</label><input id="conf" type="number" step="0.05" value="0.5"></div>
        <div><label for="limit">개수</label><input id="limit" type="number" value="20"></div>
        <button class="go" data-q="top_rules">상위 규칙</button>
      </div>
      <div class="row">
        <div><label for="period">기간</label><input id="period" value="christmas"></div>
        <button class="go" data-q="season_filter">성수기 규칙</button>
      </div>
    </div>
    <div class="panel hidden" id="browseOut"></div>
  </section>
</main>
<script>
// Demo examples only. They are written for the demo and are not from the H3 question set.
const EXAMPLES = [
  "85123A와 함께 사는 상품을 support, confidence와 함께 알려줘",
  "What should we bundle for the Christmas season?",
  "confidence 0.8 이상인 규칙 상위 5개는?",
  "LUNCH BAG 계열 상품끼리 묶음 판매할 만한 조합은?",
  "2011년 여름 성수기 규칙을 알려줘",
];
const VERDICT = {
  ok: ["b-ok", "수치 출처 확인됨", "답에 나온 수치가 모두 도구 출력이나 질문에 있습니다."],
  invented: ["b-bad", "출처 없는 수치", "도구 출력과 질문 어디에도 없는 수치가 있습니다. 채점 기준상 틀림입니다."],
  no_numbers: ["b-warn", "수치 인용 없음", "도구는 규칙을 찾았지만 답에 수치가 없습니다. 채점 기준상 틀림입니다."],
  refusal: ["b-ok", "답할 수 없음", "도구가 규칙을 찾지 못했고, 답도 답할 수 없다고 했습니다."],
  unclear: ["b-warn", "확인 필요", "도구가 규칙을 찾지 못했는데 답이 이를 분명히 말하지 않습니다."],
};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (v) => typeof v === "number" ? (Number.isInteger(v) ? v.toLocaleString() : v.toFixed(4)) : esc(v);

async function api(path, opts) {
  const r = await fetch(path, opts);
  const data = await r.json().catch(() => ({error: `HTTP ${r.status}`}));
  if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
  return data;
}

function rulesTable(out) {
  if (out.error) return `<p class="err">${esc(out.error)}</p>`;
  const rules = out.rules || [];
  const head = `<p class="meta">${esc(out.table || "")} · 규칙 ${rules.length}개` +
    (out.n_matching != null ? ` (조건을 넘는 규칙 ${out.n_matching}개)` : "") +
    (out.n_baskets ? ` · 장바구니 ${out.n_baskets.toLocaleString()}개` : "") + `</p>`;
  if (!rules.length) return head + `<p class="meta">${esc(out.message || "해당 규칙 없음")}</p>`;
  const rows = rules.map((r) => `<tr><td>${esc(r.rule_id)}</td>
    <td><code>${esc(r.antecedent)}</code> ${esc(r.antecedent_name)}</td>
    <td><code>${esc(r.consequent)}</code> ${esc(r.consequent_name)}</td>
    <td class="num">${fmt(r.count)}</td><td class="num">${fmt(r.support)}</td>
    <td class="num">${fmt(r.confidence)}</td><td class="num">${fmt(r.lift)}</td></tr>`).join("");
  return head + `<div class="tablewrap"><table><thead><tr><th>ID</th><th>선행 상품 (A)</th><th>후행 상품 (B)</th>
    <th>count</th><th>support</th><th>confidence</th><th>lift</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function markNumbers(answer, unsupported) {
  // highlight numbers the check could not find in any source
  let html = esc(answer);
  for (const n of new Set(unsupported)) {
    const re = new RegExp(`(?<![\\w.])${n.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}(?![\\w])`, "g");
    html = html.replace(re, `<mark class="bad">${esc(n)}</mark>`);
  }
  return html;
}

async function ask() {
  const question = $("q").value.trim();
  if (!question) return;
  const btn = $("askBtn"), box = $("result");
  btn.disabled = true; box.classList.remove("hidden");
  box.innerHTML = `<p class="status">답변 생성 중…</p>`;
  try {
    const d = await api("/api/ask", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({question, method: $("method").value})});
    const [cls, label, desc] = VERDICT[d.check.verdict] || ["b-warn", d.check.verdict, ""];
    const calls = d.tool_calls.map((c, i) => `<details ${i === 0 ? "open" : ""}>
        <summary><code>${esc(c.tool)}(${esc(JSON.stringify(c.args))})</code> → 규칙 ${c.output.n_rules ?? 0}개</summary>
        ${rulesTable(c.output)}</details>`).join("");
    box.innerHTML = `
      <div><span class="badge ${cls}">${label}</span> <span class="meta">${esc(desc)}</span></div>
      <div class="answer">${markNumbers(d.answer, d.check.unsupported)}</div>
      <p class="meta">${esc(d.method)}${d.model ? " · " + esc(d.model) : ""} · ${d.seconds}초 ·
        인용한 수치 ${d.check.cited.length}개 · 출처 없는 수치 ${d.check.unsupported.length}개
        ${d.check.unsupported.length ? "(" + d.check.unsupported.map(esc).join(", ") + ")" : ""}</p>
      <h3 style="font-size:15px;margin:14px 0 0">도구 호출 ${d.tool_calls.length}회</h3>
      ${calls || `<p class="meta">${d.method === "paste" ? "붙여 넣기 방식은 도구를 부르지 않고 규칙 표 전체를 프롬프트로 받습니다." : "도구를 부르지 않았습니다."}</p>`}
      <p class="meta" style="margin-top:12px">답변 확인은 자동 점검입니다. H3 채점은 정답지로 따로 합니다.</p>`;
  } catch (e) {
    box.innerHTML = `<p class="err">${esc(e.message)}</p>`;
  } finally { btn.disabled = false; }
}

async function browse(kind) {
  const box = $("browseOut"); box.classList.remove("hidden");
  const p = new URLSearchParams();
  if (kind === "rules_for") p.set("product", $("product").value.trim());
  if (kind === "top_rules") { p.set("min_support", $("sup").value); p.set("min_confidence", $("conf").value); p.set("limit", $("limit").value); }
  if (kind === "season_filter") p.set("period", $("period").value);
  box.innerHTML = `<p class="status">조회 중…</p>`;
  try { box.innerHTML = rulesTable(await api(`/api/${kind}?${p}`)); }
  catch (e) { box.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}

document.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("on", x === b));
  $("tab-ask").classList.toggle("hidden", b.dataset.tab !== "ask");
  $("tab-browse").classList.toggle("hidden", b.dataset.tab !== "browse");
});
document.querySelectorAll("button[data-q]").forEach((b) => b.onclick = () => browse(b.dataset.q));
$("product").addEventListener("keydown", (e) => { if (e.key === "Enter") browse("rules_for"); });
$("askBtn").onclick = ask;
$("q").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) ask(); });
$("examples").innerHTML = EXAMPLES.map((q) => `<button>${esc(q)}</button>`).join("");
$("examples").querySelectorAll("button").forEach((b) => b.onclick = () => { $("q").value = b.textContent; });

api("/api/health").then((h) => {
  $("health").textContent = `규칙 ${h.n_rules_y1}개 (1년 차, 장바구니 ${h.n_baskets_y1.toLocaleString()}개) · ` +
    `성수기 규칙 ${h.n_rules_season}개 · 모델 ${h.model} · ` + (h.has_key ? "Solar 키 있음" : "Solar 키 없음: 키워드 라우터만 사용 가능");
  if (!h.has_key) {
    $("method").value = "router";
    [...$("method").options].forEach((o) => { if (o.value !== "router") o.disabled = true; });
  }
}).catch((e) => { $("health").textContent = "서버 연결 실패: " + e.message; });
</script>
</body>
</html>
